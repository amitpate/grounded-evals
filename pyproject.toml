[project]
name = "grounded-evals"
version = "0.1.0"
description = "Citation faithfulness evaluation for retrieval-grounded generation: claim extraction, citation-to-span alignment, per-claim verdicts, human-review routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit Pate" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grounded_evals*"]

